<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Homework Helper</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <header>
            <div class="logo">🤖</div>

            <h1>AI Homework Helper</h1>

            <p>
                Get help with your homework using AI.
            </p>
        </header>

        <main>

            <label for="subject">Choose Subject</label>

            <select id="subject">
                <option value="General">General</option>
                <option value="Math">Math</option>
                <option value="Science">Science</option>
                <option value="English">English</option>
                <option value="History">History</option>
                <option value="Computer">Computer</option>
            </select>


            <label for="question">Your Homework Question</label>

            <textarea
                id="question"
                placeholder="Type your homework question here..."
            ></textarea>


            <button onclick="solveHomework()">
                🤖 Solve Homework
            </button>


            <section class="answer-box">

                <h2>💡 Answer</h2>

                <p id="answer">
                    Your answer will appear here.
                </p>

            </section>

        </main>

        <footer>
            <p>Made with ❤️ for students</p>
        </footer>

    </div>


    <script>

        function solveHomework() {

            const question =
                document.getElementById("question").value;

            const subject =
                document.getElementById("subject").value;

            const answer =
                document.getElementById("answer");


            if (question.trim() === "") {

                answer.innerHTML =
                    "⚠️ Please enter your homework question.";

                return;
            }


            answer.innerHTML =
                "⏳ Your " + subject +
                " homework question is ready to solve!";


            // Real AI will be connected here later.
        }

    </script>

</body>
</html>
